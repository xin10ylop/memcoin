[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha"
version = "0.1.0"
description = "Quantitative Solana memecoin trading system"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "rich>=13.0",
    "typer>=0.9",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "lightgbm>=4.0", "scipy>=1.11"]
live = ["solders>=0.21", "solana>=0.34", "base58>=2.1", "websockets>=12.0"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "pytest-cov>=4.1", "ruff>=0.1"]

[project.scripts]
alpha = "alpha.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
